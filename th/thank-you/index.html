<!-- Thank you. noindex — an indexed thank-you page corrupts the pixel conversion
     count and the GA4 goal. No navigation menu. One file, four states by URL
     parameter: ?source=enquiry | survey | lp | payment. Missing or unrecognised
     falls back to the enquiry variant, never a blank state. -->
<div class="lp-mark">
  <a class="brand" href="../../th/index.html"><img class="brand__logo" src="../../assets/logo.png" alt="Start Right Up" width="160" height="160"><span>Start <b>Right</b> Up</span></a>
</div>
<main id="main">
  <section class="section">
    <div class="wrap">
      <div class="sec-hd"><h2 id="ty-heading" data-enquiry="ขอบคุณค่ะ เราได้รับคำตอบของคุณเรียบร้อยแล้ว" data-survey="ขอบคุณค่ะ เราได้รับคำตอบของคุณเรียบร้อยแล้ว" data-lp="ขอบคุณที่ติดต่อเราค่ะ" data-payment="เรียบร้อยแล้ว!">ขอบคุณค่ะ เราได้รับคำตอบของคุณเรียบร้อยแล้ว</h2></div>
      <div class="prose">
        <p id="ty-body" data-enquiry="คำตอบของคุณช่วยให้เราเข้าใจการย้าย ลำดับความสำคัญ และความช่วยเหลือที่คุณอาจต้องการได้ดียิ่งขึ้น ทีมงานของเราจะตรวจสอบข้อมูลและติดต่อกลับภายใน 1–2 วันทำการ" data-survey="คำตอบของคุณช่วยให้เราเข้าใจการย้าย ลำดับความสำคัญ และความช่วยเหลือที่คุณอาจต้องการได้ดียิ่งขึ้น ทีมงานของเราจะตรวจสอบข้อมูลและติดต่อกลับภายใน 1–2 วันทำการ" data-lp="เราได้รับข้อมูลของคุณแล้ว และจะทำการตรวจสอบคำขอของคุณในเร็วๆ นี้ ทีมงานของเราจะติดต่อกลับภายใน 1–2 วันทำการ เพื่อพูดคุยถึงขั้นตอนต่อไป" data-payment="เราได้รับการชำระเงินของคุณเรียบร้อยแล้ว และใบเสร็จจะถูกส่งไปยังอีเมลของคุณ ทีมงานของเราจะติดต่อกลับในเร็วๆ นี้ เพื่อยืนยันขั้นตอนถัดไป และเริ่มต้นเส้นทางกับ Start Right Up ของคุณ">คำตอบของคุณช่วยให้เราเข้าใจการย้าย ลำดับความสำคัญ และความช่วยเหลือที่คุณอาจต้องการได้ดียิ่งขึ้น ทีมงานของเราจะตรวจสอบข้อมูลและติดต่อกลับภายใน 1–2 วันทำการ</p>
      </div>
      <div class="hero__cta on-light">
        <a class="btn btn--primary on-light" href="../../th/index.html">กลับไปหน้าแรก</a>
      </div>
    </div>
  </section>

<script>
/* Four states, one file. The parameter carries the source, the path carries
   the language. Both states are already painted from the enquiry variant, so a
   script failure costs the variant, never the page. */
(function(){try{
  var src=(new URLSearchParams(location.search).get('source')||'enquiry').toLowerCase();
  if(['enquiry','survey','lp','payment'].indexOf(src)<0)src='enquiry';
  ['ty-heading','ty-body'].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&el.dataset[src])el.textContent=el.dataset[src];
  });
}catch(e){}})();
</script>
<script src="../../assets/site.js" defer></script>
