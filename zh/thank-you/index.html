<body>
<a class="skip" href="#main">跳至主要内容</a>

<!-- Thank you. noindex — an indexed thank-you page corrupts the pixel conversion
     count and the GA4 goal. No navigation menu. One file, four states by URL
     parameter: ?source=enquiry | survey | lp | payment. Missing or unrecognised
     falls back to the enquiry variant, never a blank state. -->
<div class="lp-mark">
  <a class="brand" href="../../zh/index.html"><img class="brand__logo" src="../../assets/logo.png" alt="Start Right Up" width="160" height="160"><span>Start <b>Right</b> Up</span></a>
</div>
<main id="main">
  <section class="section">
    <div class="wrap">
      <div class="sec-hd"><h2 id="ty-heading" data-enquiry="感谢您——我们已收到您的回复。" data-survey="感谢您——我们已收到您的回复。" data-lp="感谢您的联系。" data-payment="一切就绪！">感谢您——我们已收到您的回复。</h2></div>
      <div class="prose">
        <p id="ty-body" data-enquiry="Your responses help us better understand your move, priorities and what support you may need. Our team will review them and be in touch within 1–2 business days." data-survey="Your responses help us better understand your move, priorities and what support you may need. Our team will review them and be in touch within 1–2 business days." data-lp="We&#39;ve received your details and will review your request shortly. Our team will contact you within 1–2 business days to discuss what comes next." data-payment="Your payment has been successfully received, and a receipt will be sent to your email. Our team will contact you shortly to confirm the next steps and begin your Start Right Up journey.">Your responses help us better understand your move, priorities and what support you may need. Our team will review them and be in touch within 1–2 business days.</p>
      </div>
      <div class="hero__cta on-light">
        <a class="btn btn--primary on-light" href="../../zh/index.html">返回首页</a>
      </div>
    </div>
  </section>
</main>
<div class="lp-copyright">&copy; 2026 Start Right Up</div>
<script>
/* Four states, one file. The parameter carries the source, the path carries
   the language. Both states are already painted from the enquiry variant, so a
   script failure costs the variant, never the page. */
(function(){try{
  var src=(new URLSearchParams(location.search).get('source')||'enquiry').toLowerCase();
  if(['enquiry','survey','lp','payment'].indexOf(src)<0)src='enquiry';
  ['ty-heading','ty-body'].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&el.dataset[src])el.textContent=el.dataset[src];
  });
}catch(e){}})();
</script>
<script src="../../assets/site.js" defer></script>
